[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "flowpilot-observability"
version = "0.1.0"
description = "OpenTelemetry tracing, secret-redacting structured logging, and Prometheus metrics for FlowPilot"
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-api>=1.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flowpilot_observability"]

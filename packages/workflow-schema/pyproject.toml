[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "flowpilot-schema"
version = "0.1.0"
description = "Canonical canvas-independent workflow graph schema and execution state models for FlowPilot"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flowpilot_schema"]

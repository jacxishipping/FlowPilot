[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "flowpilot-credentials"
version = "0.1.0"
description = "Tenant-bound AES-256-GCM envelope encryption for FlowPilot credentials"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44.0.0",
    "pydantic>=2.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flowpilot_credentials"]

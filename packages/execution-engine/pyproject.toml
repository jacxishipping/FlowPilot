[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "flowpilot-engine"
version = "0.1.0"
description = "Deterministic graph interpreter, durable workflow execution coordinator, and Temporal adapter for FlowPilot"
requires-python = ">=3.12"
dependencies = [
    "flowpilot-schema",
    "flowpilot-expressions",
    "flowpilot-node-sdk",
    "flowpilot-validator",
    "pydantic>=2.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flowpilot_engine"]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "flowpilot-node-sdk"
version = "0.1.0"
description = "Typed Python Node SDK for building FlowPilot workflow integrations and nodes"
requires-python = ">=3.12"
dependencies = [
    "flowpilot-schema",
    "cryptography>=44.0.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flowpilot"]

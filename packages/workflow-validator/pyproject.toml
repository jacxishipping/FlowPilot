[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "flowpilot-validator"
version = "0.1.0"
description = "Pre-publish structural, data-flow, expression, schema, credential, and policy validator for FlowPilot"
requires-python = ">=3.12"
dependencies = [
    "flowpilot-schema",
    "flowpilot-expressions",
    "flowpilot-node-sdk",
    "pydantic>=2.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flowpilot_validator"]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "flowpilot-scheduler"
version = "0.1.0"
description = "Cron trigger evaluator and idempotent workflow run scheduler for FlowPilot"
requires-python = ">=3.12"
dependencies = [
    "flowpilot-schema",
    "flowpilot-engine",
    "flowpilot-api",
    "sqlalchemy[asyncio]>=2.0.36",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flowpilot_scheduler"]

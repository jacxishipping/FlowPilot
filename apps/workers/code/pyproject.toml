[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "flowpilot-worker-code"
version = "0.1.0"
description = "Isolated untrusted user code execution sandbox and worker pool for FlowPilot"
requires-python = ">=3.12"
dependencies = [
    "flowpilot-schema",
    "flowpilot-node-sdk",
    "pydantic>=2.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flowpilot_worker_code"]

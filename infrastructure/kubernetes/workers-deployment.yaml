apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowpilot-worker-workflow
  namespace: flowpilot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flowpilot-worker-workflow
  template:
    metadata:
      labels:
        app: flowpilot-worker-workflow
        flowpilot.io/pool: workflow
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: worker
          image: ghcr.io/flowpilot/worker:latest
          env:
            - name: FLOWPILOT_WORKER_POOL
              value: workflow
          envFrom:
            - secretRef:
                name: flowpilot-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---

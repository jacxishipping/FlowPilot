apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowpilot-worker-code
  namespace: flowpilot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flowpilot-worker-code
  template:
    metadata:
      labels:
        app: flowpilot-worker-code
        flowpilot.io/pool: code
    spec:
      # Optional gVisor runtimeClassName for untrusted user code isolation
      # runtimeClassName: gvisor
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: worker
          image: ghcr.io/flowpilot/worker:latest
          env:
            - name: FLOWPILOT_WORKER_POOL
              value: code
          envFrom:
            - secretRef:
                name: flowpilot-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: sandbox-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: sandbox-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi

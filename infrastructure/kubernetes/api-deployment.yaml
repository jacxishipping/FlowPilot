apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowpilot-api
  namespace: flowpilot
  labels:
    app: flowpilot-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flowpilot-api
  template:
    metadata:
      labels:
        app: flowpilot-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: ghcr.io/flowpilot/api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: flowpilot-secrets
            - configMapRef:
                name: flowpilot-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: flowpilot-api
  namespace: flowpilot
spec:
  selector:
    app: flowpilot-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flowpilot-api-hpa
  namespace: flowpilot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flowpilot-api
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

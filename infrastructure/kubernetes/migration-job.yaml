apiVersion: batch/v1
kind: Job
metadata:
  name: flowpilot-db-migrate
  namespace: flowpilot
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: alembic
          image: ghcr.io/flowpilot/api:latest
          command: ["uv", "run", "alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: flowpilot-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

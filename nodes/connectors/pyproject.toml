[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "flowpilot-nodes-connectors"
version = "0.1.0"
description = "First-party SaaS connectors (GitHub, Linear, Notion, Google Sheets, Stripe, HubSpot)"
requires-python = ">=3.12"
dependencies = [
    "flowpilot-schema",
    "flowpilot-node-sdk",
    "pydantic>=2.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flowpilot_nodes_connectors"]

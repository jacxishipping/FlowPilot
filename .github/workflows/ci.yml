name: FlowPilot CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync workspace
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: Mypy strict type check
        run: uv run mypy packages nodes apps scripts tests
      - name: Pytest suite
        run: uv run pytest -v

  postgres-rls-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: flowpilot
          POSTGRES_PASSWORD: flowpilot
          POSTGRES_DB: flowpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLOWPILOT_DATABASE_URL: postgresql+asyncpg://flowpilot:flowpilot@localhost:5432/flowpilot
      FLOWPILOT_TEST_POSTGRES_URL: postgresql+asyncpg://flowpilot:flowpilot@localhost:5432/flowpilot
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync workspace
        run: uv sync
      - name: Apply Alembic migrations (pgvector + FORCE RLS)
        run: uv run alembic upgrade head
      - name: Run live PostgreSQL RLS & pgvector test
        run: uv run pytest -v tests/test_postgres_rls_live.py

  web-studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript strict check
        run: npm run typecheck
      - name: Production build
        run: npm run build

  playwright-e2e:
    runs-on: ubuntu-latest
    needs: [python-backend, web-studio]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sync backend
        run: uv sync
      - name: Install web + Playwright Chromium
        working-directory: apps/web
        run: |
          npm install --no-audit --no-fund
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Boot API + Web and run Playwright E2E
        run: |
          FLOWPILOT_DATABASE_URL=sqlite+aiosqlite:///./ci_e2e.db FLOWPILOT_AUTO_CREATE_TABLES=true \
            uv run uvicorn flowpilot_api.app:app --host 127.0.0.1 --port 8000 &
          (cd apps/web && NEXT_PUBLIC_API_URL=http://127.0.0.1:8000 npm run dev) &
          npx wait-on http://127.0.0.1:8000/health http://127.0.0.1:3000 -t 60000
          cd apps/web && npx playwright test
